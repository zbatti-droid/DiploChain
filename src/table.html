<!DOCTYPE html>
<html>
<head>
<style>

table, th, td {
    border: 1px solid black;
    border-collapse: collapse;
}

th {
    font-family: 'Times New Roman';
    font-size: 24px;
}

th, td {
    width: 50px;
    height: 50px;
    text-align: center;
}

tr:nth-child(odd) {
    background-color: gray;
}

tr:hover {
    background-color: red;
    font-size: x-large;
}

</style>
</head>

<body>

<table>

<tr>
    <th>ID</th>
    <th>Nom</th>
    <th>Prénom</th>
    <th>Age</th>
</tr>

<tr>
    <td>1</td>
    <td>Ali</td>
    <td>Ahmed</td>
    <td>22</td>
</tr>

<tr>
    <td>2</td>
    <td>Sara</td>
    <td>Laila</td>
    <td>24</td>
</tr>

</table>

</body>
</html>
